[book]
title = "Dimensional Modelling Docs"
authors = ["acivitillo"]
description = "Reference documentation for dimensional (Kimball) data modelling."
language = "en"
src = "src"

[output.html]
default-theme = "rust"          # dyvenia "soft light": warm-grey paper (#f5f5f5)
preferred-dark-theme = "coal"   # dyvenia's charcoal dark mode (#2d2e2f)
additional-css = ["theme/custom.css", "theme/zoom.css"]
git-repository-url = "https://github.com/dyvenia/dim-modelling-docs"
edit-url-template = "https://github.com/dyvenia/dim-modelling-docs/edit/main/src/{path}"
mathjax-support = false
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/zoom.js", "theme/sidebar.js"]

[output.html.fold]
enable = true
level = 0   # collapse foldable groups (e.g. Definitions) by default

[output.html.search]
enable = true

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Generates an LLM-friendly index at /llms.txt (see https://llmstxt.org).
# Mirrors the SUMMARY.md nav as a link list with one-line descriptions.
[preprocessor.llms-txt]
command = "python3 tools/llms_txt_preprocessor.py"
renderer = ["html"]
# Absolute base URL for the links (recommended by the spec). Leave empty for
# site-root-relative links, e.g. "concepts/dimension.html".
site-url = "https://dyvenia.github.io/dim-modelling-docs/"
